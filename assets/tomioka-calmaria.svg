<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" width="100%" height="100%">
  <defs>
    <!-- Ceu Abissal Noturno -->
    <linearGradient id="abyssSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02050E"/>
      <stop offset="55%" stop-color="#071124"/>
      <stop offset="100%" stop-color="#0D254C"/>
    </linearGradient>

    <!-- Superficie Espelhada da Calmaria (Safira -> Prata -> Azul Profundo) -->
    <linearGradient id="calmMirror" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.45"/>
      <stop offset="18%" stop-color="#1D4ED8" stop-opacity="0.85"/>
      <stop offset="52%" stop-color="#0F2952"/>
      <stop offset="100%" stop-color="#040B1A"/>
    </linearGradient>

    <!-- Aura Circular do Dominio -->
    <radialGradient id="domainLight" cx="68%" cy="56%" r="48%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.34"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#1E40AF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#02050E" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente da Muralha de Agua -->
    <linearGradient id="waveWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="28%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#091836"/>
    </linearGradient>

    <!-- Padrao Geometrico Isometrico Autentico do Haori do Tomioka -->
    <pattern id="tomiokaPattern" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#15803D"/>
      <polygon points="9,0 18,4.5 18,13.5 9,18 0,13.5 0,4.5" fill="#EAB308" opacity="0.9"/>
      <polygon points="9,0 18,4.5 9,9 0,4.5" fill="#166534"/>
      <polygon points="9,9 18,13.5 9,18 0,13.5" fill="#EA580C" opacity="0.85"/>
      <circle cx="9" cy="9" r="1.6" fill="#090D16"/>
    </pattern>

    <!-- Brilho Suave -->
    <filter id="glowFx" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Fundo do Ceu Noturno -->
  <rect width="1600" height="260" fill="url(#abyssSky)"/>

  <!-- 2. Muralha Circular de Ondas Suspensas (Barreira da 11a Forma) -->
  <g>
    <!-- Camada traseira de ondas altas -->
    <path d="M0,225 Q90,150 180,205 T360,185 T540,210 T720,175 T900,195 T1080,165 T1260,192 T1440,170 T1600,205 L1600,265 L0,265 Z" fill="url(#waveWall)" opacity="0.72">
      <animate attributeName="d" dur="6.5s" repeatCount="indefinite"
        values="M0,225 Q90,150 180,205 T360,185 T540,210 T720,175 T900,195 T1080,165 T1260,192 T1440,170 T1600,205 L1600,265 L0,265 Z;
                M0,215 Q90,175 180,188 T360,208 T540,182 T720,202 T900,172 T1080,196 T1260,168 T1440,198 T1600,185 L1600,265 L0,265 Z;
                M0,225 Q90,150 180,205 T360,185 T540,210 T720,175 T900,195 T1080,165 T1260,192 T1440,170 T1600,205 L1600,265 L0,265 Z"/>
    </path>

    <!-- Crista de Espuma Branca estilo Ukiyo-e -->
    <path d="M0,225 Q90,150 180,205 T360,185 T540,210 T720,175 T900,195 T1080,165 T1260,192 T1440,170 T1600,205"
          fill="none" stroke="#F0F9FF" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="22 8 6 10" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="0" to="92" dur="4.2s" repeatCount="indefinite"/>
    </path>
    <path d="M0,235 Q120,185 240,222 T480,205 T720,226 T960,198 T1200,220 T1440,195 T1600,222"
          fill="none" stroke="#7DD3FC" stroke-width="2.5" stroke-dasharray="14 12" opacity="0.65">
      <animate attributeName="stroke-dashoffset" from="52" to="0" dur="3.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 3. Superficie Espelhada da Calmaria (Agua Imovel) -->
  <rect y="242" width="1600" height="218" fill="url(#calmMirror)"/>
  <ellipse cx="1090" cy="295" rx="680" ry="155" fill="url(#domainLight)"/>

  <!-- Linha de Horizonte Luminosa do Dominio -->
  <ellipse cx="1090" cy="246" rx="520" ry="14" fill="none" stroke="#BAE6FD" stroke-width="1.6" opacity="0.55"/>

  <!-- 4. Ondas Concentricas Lentas e Cristalinas Sob o Hashira -->
  <g fill="none" stroke="#7DD3FC">
    <ellipse cx="1090" cy="368" rx="40" ry="9" stroke-width="2.2">
      <animate attributeName="rx" values="30;440" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="7;72" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.9;0" dur="5.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1090" cy="368" rx="40" ry="9" stroke-width="1.7">
      <animate attributeName="rx" values="30;440" dur="5.2s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="7;72" dur="5.2s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.8;0" dur="5.2s" begin="1.7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1090" cy="368" rx="40" ry="9" stroke-width="1.2">
      <animate attributeName="rx" values="30;440" dur="5.2s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="7;72" dur="5.2s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.65;0" dur="5.2s" begin="3.4s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- 5. Reflexo Invertido de Giyu Tomioka na Agua Espelhada -->
  <g transform="translate(1090, 372) scale(1, -0.52)" opacity="0.26" filter="url(#glowFx)">
    <path d="M-22,0 L-34,76 L0,76 Z" fill="#881337"/>
    <path d="M22,0 L34,76 L0,76 Z" fill="#15803D"/>
    <rect x="-18" y="76" width="12" height="52" fill="#0F172A"/>
    <rect x="6" y="76" width="12" height="52" fill="#0F172A"/>
  </g>

  <!-- 6. Giyu Tomioka (Hashira da Agua — Pose da 11a Forma com Nichirin) -->
  <g transform="translate(1090, 224)">
    <!-- Contato dos pes na superficie da agua -->
    <ellipse cx="0" cy="144" rx="34" ry="7" fill="#020617" opacity="0.75"/>
    <ellipse cx="0" cy="144" rx="22" ry="4" fill="none" stroke="#E0F2FE" stroke-width="1.4" opacity="0.85"/>

    <!-- Hakama (Calca tradicional larga com pregas) -->
    <path d="M-18,78 L-23,128 L-6,128 L-2,90 L2,90 L6,128 L23,128 L18,78 Z" fill="#0B1120"/>
    <path d="M-11,82 L-13,126 M11,82 L13,126" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Kyahan (Faixas brancas nas canelas com amarracoes) e Sandalias Zori -->
    <rect x="-19" y="124" width="11" height="14" rx="1.5" fill="#F1F5F9"/>
    <rect x="8" y="124" width="11" height="14" rx="1.5" fill="#F1F5F9"/>
    <line x1="-19" y1="129" x2="-8" y2="129" stroke="#0F172A" stroke-width="1.4"/>
    <line x1="8" y1="129" x2="19" y2="129" stroke="#0F172A" stroke-width="1.4"/>
    <rect x="-20" y="139" width="13" height="4" rx="1" fill="#334155"/>
    <rect x="7" y="139" width="13" height="4" rx="1" fill="#334155"/>

    <!-- Tronco, Haori Bicolor e Espada Nichirin com Ciclo de Respiracao Serena -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2.8; 0,0" dur="4.4s" repeatCount="indefinite"/>

      <!-- Bainha na cintura esquerda -->
      <line x1="-16" y1="68" x2="-46" y2="94" stroke="#090D16" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="-16" y1="68" x2="-46" y2="94" stroke="#64748B" stroke-width="1"/>

      <!-- Metade Esquerda do Haori (Bordo Profundo com Sombreamento) -->
      <path d="M0,18 L-28,26 L-38,88 L-16,90 L0,88 Z" fill="#881337"/>
      <path d="M-12,24 L-22,88" stroke="#4C0519" stroke-width="2" opacity="0.65"/>

      <!-- Metade Direita do Haori (Padrao Geometrico Verde/Ouro/Laranja) -->
      <path d="M0,18 L28,26 L38,88 L16,90 L0,88 Z" fill="url(#tomiokaPattern)"/>
      <path d="M12,24 L22,88" stroke="#052E16" stroke-width="2" opacity="0.45"/>

      <!-- Divisao Central do Haori & Gola do Uniforme -->
      <line x1="0" y1="18" x2="0" y2="88" stroke="#020617" stroke-width="1.8"/>
      <path d="M-9,18 L0,30 L9,18" fill="#0F172A" stroke="#F8FAFC" stroke-width="2"/>
      <rect x="-19" y="64" width="38" height="6" rx="1" fill="#F8FAFC"/>

      <!-- Mao Direita Empunhando a Espada Nichirin Negra Baixada (Pose Calmaria) -->
      <line x1="26" y1="68" x2="64" y2="118" stroke="#020617" stroke-width="4" stroke-linecap="round"/>
      <line x1="26" y1="68" x2="64" y2="118" stroke="#38BDF8" stroke-width="1.2" opacity="0.95"/>
      <!-- Guarda (Tsuba) da Katana -->
      <line x1="21" y1="73" x2="31" y2="63" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>

      <!-- Cabeca e Cabelo Espetado Caracteristico de Giyu Tomioka -->
      <g transform="translate(0, 4)">
        <circle cx="0" cy="0" r="12" fill="#090D16"/>
        <!-- Mechas espetadas em camadas -->
        <path d="M-13,-2 L-21,5 L-14,4 L-19,14 L-10,9 L-12,18 L-4,11 L0,16 L4,11 L12,18 L10,9 L19,14 L14,4 L21,5 L13,-2 Q12,-16 0,-16 Q-12,-16 -13,-2 Z" fill="#090D16"/>
        <!-- Reflexo azulado no cabelo -->
        <path d="M-8,-9 Q0,-13 8,-9" fill="none" stroke="#1E3A8A" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Rabo de cavalo baixo preso -->
        <path d="M-2,12 L-5,32 L4,30 L1,12 Z" fill="#090D16"/>
      </g>
    </g>
  </g>

  <!-- 7. Particulas de Nevoa e Gotas Suspensas no Ar -->
  <g fill="#BAE6FD" filter="url(#glowFx)">
    <circle cx="940" cy="320" r="2.2">
      <animate attributeName="cy" values="335;240" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1235" cy="310" r="2.5">
      <animate attributeName="cy" values="330;230" dur="5.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="5.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1015" cy="290" r="1.8">
      <animate attributeName="cy" values="305;215" dur="4.1s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="4.1s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1165" cy="340" r="2">
      <animate attributeName="cy" values="350;255" dur="4.9s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="4.9s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 8. Tipografia de Engenharia (Alinhada a Esquerda para Equilibrio Visual) -->
  <g font-family="'Segoe UI', Inter, system-ui, sans-serif">
    <rect x="68" y="64" width="4" height="114" rx="2" fill="#38BDF8"/>
    <text x="88" y="84" fill="#38BDF8" font-size="13" font-weight="700" letter-spacing="3.2">WATER BREATHING · ELEVENTH FORM: DEAD CALM</text>
    <text x="88" y="132" fill="#F8FAFC" font-size="46" font-weight="800" letter-spacing="1.5">YAGO SANTOS SILVA</text>
    <text x="88" y="166" fill="#CBD5E1" font-size="16" font-weight="500" letter-spacing="1.8">BACKEND &amp; AI SYSTEMS · CLOUD ARCHITECTURE · ACCESSIBILITY QA</text>
  </g>
</svg>