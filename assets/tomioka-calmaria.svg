<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="55%" stop-color="#091326"/>
      <stop offset="100%" stop-color="#0F294A"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C2444"/>
      <stop offset="35%" stop-color="#143D73"/>
      <stop offset="100%" stop-color="#061224"/>
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#1D4ED8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <pattern id="haoriGeom" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#15803D"/>
      <polygon points="7,0 14,7 7,14 0,7" fill="#D97706" opacity="0.88"/>
      <circle cx="7" cy="7" r="2.2" fill="#090D16"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ceu Noturno Profundo -->
  <rect width="1600" height="230" fill="url(#skyGrad)"/>

  <!-- Horizonte de Ondas & Espuma (Estilo Ukiyo-e / Hashira da Agua) -->
  <path d="M0,210 Q120,175 240,205 T480,198 T720,208 T960,195 T1200,206 T1440,194 T1600,205 L1600,245 L0,245 Z" fill="#1E40AF" opacity="0.55">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0,210 Q120,175 240,205 T480,198 T720,208 T960,195 T1200,206 T1440,194 T1600,205 L1600,245 L0,245 Z;
              M0,205 Q120,192 240,196 T480,210 T720,195 T960,208 T1200,194 T1440,208 T1600,198 L1600,245 L0,245 Z;
              M0,210 Q120,175 240,205 T480,198 T720,208 T960,195 T1200,206 T1440,194 T1600,205 L1600,245 L0,245 Z"/>
  </path>
  <path d="M0,218 Q160,198 320,216 T640,212 T960,218 T1280,210 T1600,217" fill="none" stroke="#E0F2FE" stroke-width="2.5" opacity="0.65" stroke-dasharray="18 10 6 12">
    <animate attributeName="stroke-dashoffset" from="0" to="92" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- Superficie da Agua Calma (Dominio) -->
  <rect y="222" width="1600" height="198" fill="url(#waterGrad)"/>
  <ellipse cx="800" cy="275" rx="520" ry="120" fill="url(#auraGlow)"/>

  <!-- Ondas Concentricas (Decima Primeira Forma: Calmaria) -->
  <g fill="none" stroke="#38BDF8">
    <ellipse cx="800" cy="318" rx="45" ry="11" stroke-width="2">
      <animate attributeName="rx" values="35;340" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="8;68" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.85;0" dur="4.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="800" cy="318" rx="45" ry="11" stroke-width="1.6">
      <animate attributeName="rx" values="35;340" dur="4.8s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="8;68" dur="4.8s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.75;0" dur="4.8s" begin="1.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="800" cy="318" rx="45" ry="11" stroke-width="1.2">
      <animate attributeName="rx" values="35;340" dur="4.8s" begin="3.2s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="8;68" dur="4.8s" begin="3.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.65;0" dur="4.8s" begin="3.2s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Reflexos Horizontais na Agua -->
  <g stroke="#7DD3FC" stroke-linecap="round" opacity="0.28">
    <line x1="210" y1="265" x2="360" y2="265" stroke-width="2"/>
    <line x1="1220" y1="278" x2="1390" y2="278" stroke-width="2"/>
    <line x1="430" y1="345" x2="560" y2="345" stroke-width="1.5"/>
    <line x1="1040" y1="352" x2="1180" y2="352" stroke-width="1.5"/>
  </g>

  <!-- Figura Estilizada de Giyu Tomioka no Centro do Dominio (Respiracao Serena) -->
  <g transform="translate(800, 215)">
    <!-- Sombra / Reflexo na Agua -->
    <ellipse cx="0" cy="103" rx="26" ry="6" fill="#020617" opacity="0.7"/>

    <!-- Pernas / Hakama -->
    <path d="M-13,56 L-16,100 L-5,100 L-2,65 L2,65 L5,100 L16,100 L13,56 Z" fill="#0F172A"/>
    <!-- Faixas brancas nas canelas -->
    <rect x="-15" y="88" width="9" height="8" rx="1" fill="#E2E8F0"/>
    <rect x="6" y="88" width="9" height="8" rx="1" fill="#E2E8F0"/>

    <!-- Tronco & Haori Bicolor com Ciclo de Respiracao -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2.4; 0,0" dur="4.2s" repeatCount="indefinite"/>
      <!-- Metade Esquerda do Haori (Bordo Solido) -->
      <path d="M0,12 L-22,18 L-28,62 L0,62 Z" fill="#881337"/>
      <!-- Metade Direita do Haori (Padrao Geometrico Verde/Ouro) -->
      <path d="M0,12 L22,18 L28,62 L0,62 Z" fill="url(#haoriGeom)"/>
      <!-- Gola e Cinto Branco -->
      <path d="M-7,12 L0,22 L7,12" fill="none" stroke="#F8FAFC" stroke-width="2"/>
      <rect x="-15" y="46" width="30" height="5" fill="#F8FAFC"/>
      <!-- Espada Nichirin na Cintura -->
      <line x1="-14" y1="49" x2="-36" y2="66" stroke="#020617" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-14" y1="49" x2="-36" y2="66" stroke="#38BDF8" stroke-width="0.9" opacity="0.8"/>
      <!-- Cabeca & Cabelo Preso -->
      <circle cx="0" cy="2" r="9.5" fill="#090D16"/>
      <path d="M-10,0 L-13,6 L-9,4 L-11,11 L-5,7 L0,10 L5,7 L11,11 L9,4 L13,6 L10,0 Q8,-10 0,-10 Q-8,-10 -10,0 Z" fill="#090D16"/>
      <path d="M-2,8 L-4,22 L3,21 L1,8 Z" fill="#090D16"/>
    </g>
  </g>

  <!-- Particulas de Nevoa Azul -->
  <g fill="#7DD3FC" filter="url(#softGlow)">
    <circle cx="670" cy="295" r="2">
      <animate attributeName="cy" values="305;245" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="285" r="2.2">
      <animate attributeName="cy" values="300;235" dur="5.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="5.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="260" r="1.6">
      <animate attributeName="cy" values="275;220" dur="3.9s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="3.9s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Tipografia Principal -->
  <g font-family="'Segoe UI', Inter, system-ui, sans-serif">
    <text x="72" y="88" fill="#38BDF8" font-size="13" font-weight="700" letter-spacing="3.5">WATER BREATHING · ELEVENTH FORM: DEAD CALM</text>
    <text x="72" y="134" fill="#F8FAFC" font-size="44" font-weight="800" letter-spacing="1.5">YAGO SANTOS SILVA</text>
    <text x="72" y="166" fill="#94A3B8" font-size="16" font-weight="500" letter-spacing="2">BACKEND &amp; AI SYSTEMS · CLOUD ARCHITECTURE · ACCESSIBILITY QA</text>
  </g>
</svg>